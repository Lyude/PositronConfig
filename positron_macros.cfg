# This file contains the Klipper macros for the Positron v3.2
# designed by the Positron 3D team in partnership with LDO

# PositronConfig v1.2.3

#####################################################################
#   Fluidd/Mainsail
#####################################################################

# Fluidd and Mainsail provide a variable setup that let you customize
# the provided PAUSE, RESUME and CANCEL_PRINT macros. If you need,
# your own park position or something, simply copy the definitions
# from fluidd.cfg and include it in this section

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 90
variable_custom_park_y    : 170
variable_custom_park_dz   : 20.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : 90
variable_park_at_cancel_y : 90
gcode:

#####################################################################
#   Homing Macros
#####################################################################

## Macros for sensorless, z-safe, and conditional homing

[force_move]
enable_force_move: true

[gcode_macro _HOME_MAYBE]
description: Safely home the toolhead on the axes in AXES if they are not already homed.
gcode:
    {% set homed_x = 'x' in printer.toolhead.homed_axes %}
    {% set homed_y = 'y' in printer.toolhead.homed_axes %}
    {% set homed_z = 'z' in printer.toolhead.homed_axes %}

    {% set axes = params.AXES|default('xyz')|lower %}

    # We need to ensure X and Y are homed when homing Z, otherwise the nozzle
    # might not be in a safe location for a load cell boop.
    {% if 'z' in axes and (not homed_x or not homed_y) %}
        {% set axes = 'z' + ('x' if not homed_x else '') + ('y' if not homed_y else '') %}
    {% endif %}

    # TODO: Mess with tuning sensorless homing a bit more to confirm the comment
    # below is correct. It's possible I just didn't tune my stallguard threshold
    # well enough. Or perhaps it's the belts…?

    {% set home_y = 'y' in axes and not homed_y %}
    # With some stallguard thresholds, homing Y may inadvertently change the X location.
    # So, always re-home X if homing Y.
    {% set home_x = ('x' in axes and not homed_x) or home_y %}
    {% set home_z = 'z' in axes and not homed_z %}

    {% set home_any = home_x or home_y or home_z %}

    {% if home_any %}
      G28 {% if home_x %} X {% endif %} {% if home_y %} Y {% endif %} {% if home_z %} Z {% endif %}
    {% endif %}

#####################################################################
#   Sound Macro
#####################################################################

[gcode_macro M300]
description: Implements M300 gcode which allows beeper to be used
gcode:
    {% set TIME_MS = params.P|default(100)|float %}
    SET_PIN PIN=_buzzer VALUE=1
    G4 P{TIME_MS}
    SET_PIN PIN=_buzzer VALUE=0

#####################################################################
#   Position Macros
#####################################################################

[gcode_macro CENTER]
description: Moves the toolhead to the center
gcode:
    _HOME_MAYBE AXES=xy
    {% set x_center = (printer.toolhead.axis_maximum.x|float + printer.toolhead.axis_minimum.x|float) / 2.0 %}
    {% set y_center = (printer.toolhead.axis_maximum.y|float + printer.toolhead.axis_minimum.y|float) / 2.0 %}
    G90
    G1 X{x_center} Y{y_center} F7800


[gcode_macro FRONT]
description: Moves the toolhead to the front
gcode:
    _HOME_MAYBE AXES=xy
    {% set x_center = (printer.toolhead.axis_maximum.x|float + printer.toolhead.axis_minimum.x|float) / 2.0 %}
    {% set y_front = printer.toolhead.axis_maximum.y|float - 10 %}
    G90
    G1 X{x_center} Y{y_front} F7800

[gcode_macro RAISE_BED]
description: If necessary, raise the bed up so the user has easy access to the nozzle
gcode:
    {% if printer.toolhead.position.z|default(0.0) < 150.0 %}
    _HOME_MAYBE AXES=z
    G1 Z150 F1200
    {% endif %}

[gcode_macro COOL_NOZZLE]
description: Cool the nozzle as quickly as possible to a safe-to-touch temperature.
variable_safe_temp: 50.0
gcode:
    {% if printer[printer.toolhead.extruder].temperature > safe_temp %}
        RESPOND MSG="Cooling nozzle, please wait…"
        LED_PENDING
        M106 S255 # Fan at max
        M104 S0 # Disable extruder heater
        TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={safe_temp}
        M107 # Shut fan back off
        RESPOND MSG="Nozzle is safe to touch!"
        LED_READY
    {% endif %}

[gcode_macro CHANGE_NOZZLE]
description: Prepare the nozzle to be changed.
# (source: Phaetus documentation)
variable_change_temp: 285.0
variable_change_wait: 1
gcode:
    RESPOND MSG="Preparing for nozzle change, please wait…"
    LED_PENDING
    M107 # Disable the print fan if it's on
    
    M104 S170 # Set pre-heat temp for probing
    _HOME_MAYBE
    RAISE_BED
    FRONT

    M109 S{change_temp} # Wait for the nozzle to heat up to the change temp
    RESPOND MSG="Don't change the nozzle yet! Please wait!"
    # FIXME: ...kalico says this is malformed? I don't understand.
    # RESPOND MSG={"Don't change yet it just yet, wait " + change_wait|string + " minute" + ("s" if change_wait != 1 else "") + "…"}
    G4 P{change_wait * 1000}

    RESPOND MSG="The nozzle may now be changed!"
    LED_READY

    # 3 short beeps to let the user know it's ready
    M300 P100
    G1 P50
    M300 P100
    G1 P50
    M300 P100

#####################################################################
#   Filament Macros
#####################################################################

[gcode_macro M600]
description: Temporary self-service M600: PAUSE and UNLOAD_FILAMENT
gcode:
    PAUSE
    RESPOND MSG="Unloading filament, reload before resuming"
    UNLOAD_FILAMENT

[gcode_macro _CHECK_LOAD_UNLOAD_TEMP]
description: Prints an error if the extruder is too cold to unload
# Since we have various macros that may set the extruder to pre-heat temps,
# we want to guard against the user mistakenly unloading at these temps.
# I don't think there's any materials (e.g. PC, PA12, etc.) we'd print on a positron
# that would have a higher pre-heat temp then this.
variable_min_temp: 190
gcode:
    {% if 'TEMP' not in params %}
        {action_raise_error("Missing TEMP argument for CHECK_LOAD_UNLOAD_TEMP")}
    {% elif params.TEMP|int < min_temp %}
        {action_raise_error("Extruder temperature too cold (must be " + min_temp|string + "°C or higher")}
    {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unloads filament from toolhead. TEMP defaults to 225 if hotend is cold
gcode:
    {% set temp_at_start = printer[printer.toolhead.extruder].temperature %}
    
    {% if 'TEMP' in params %}
        {% set extruder_temp = params.TEMP|int %}
    {% elif printer.extruder.target|int > 0 %}
        {% set using_current_temp = True %}
        {% set extruder_temp = printer.extruder.target|int %}
    {% else %}
        {% set extruder_temp = 225 %}
    {% endif %}

    {% set using_current_temp = using_current_temp|default(False) %}

    _CHECK_LOAD_UNLOAD_TEMP TEMP={extruder_temp}
 
    ; Minimum temperature to wait for
    {% set min_wait_temp = extruder_temp|float * 0.98 %}
    {% set preheat_temp = params.PREHEAT_TEMP|default(170)|int %}

    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT

    LED_PENDING

    {% if (not using_current_temp) and not (temp_at_start > preheat_temp) %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={preheat_temp}
        M104 S{preheat_temp} # Set pre-heat temp

        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={preheat_temp}
    {% endif %}

    _HOME_MAYBE # Home all un-homed axes
    RAISE_BED # Give the user some space to clean the nozzle
    FRONT

    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={min_wait_temp}

    LED_WORKING
    M83                         ; set extruder to relative mode
    G1 E10 F300                 ; extrude a little to soften tip
    G1 E-30 F3600               ; quickly retract a small amount to elimate stringing
    G4 P200                     ; pause for a short amount of time
    G1 E-400 F1200              ; retract slowly the rest of the way
    M400                        ; wait for moves to finish
    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT
    M300 P400                   ; long beep to indicate unload complete
    M117 Unload Complete!
    LED_READY


[gcode_macro LOAD_FILAMENT]
description: Loads new filament into toolhead. EXTRUDER_TEMP defaults to 225 if hotend is cold
gcode:
    {% set preheat_temp = params.PREHEAT|default(170)|int %}
    {% set temp_at_start = printer[printer.toolhead.extruder].temperature %}
    {% set current_target = printer.extruder.target|float %}

    {% if 'TEMP' in params %}
        {% set extruder_temp = params.TEMP|int %}
    {% elif printer.extruder.target|int > 0 %}
        {% set using_current_temp = True %}
        {% set extruder_temp = printer.extruder.target|int %}
    {% else %}
        {% set extruder_temp = 225 %}
    {% endif %}

    {% set using_current_temp = using_current_temp|default(False) %}
    
    _CHECK_LOAD_UNLOAD_TEMP TEMP={extruder_temp}

    {% set min_temp = extruder_temp|float * 0.98 %}

    SAVE_GCODE_STATE NAME=LOAD_FILAMENT

    {% if (not using_current_temp) and not (temp_at_start > preheat_temp) and 'z' not in printer.toolhead.homed_axes %}
        M104 S{preheat_temp} # Set the pre-heat temp on the extruder
        TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={preheat_temp} # Then wait for the extruder to finish heating
    {% endif %}

    _HOME_MAYBE
    RAISE_BED ; give the user some space to clean the nozzle
    FRONT           ; move the toolhead to the front

    LED_PENDING
    M104 S{extruder_temp} # Set final extruder temp
    {% if current_target < min_temp %}
        TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={min_temp} # Wait to hit min waiting temp
    {% endif %}

    LED_WORKING
    M83                         ; set extruder to relative mode
    M106 S255                   ; Set part cooling fan to max
    G1 E400 F1200               ; extrude slowly
    ; Was G1 E20 F600
    G1 E20 F50
    M107                        ; turn off part cooling fan
    M400                        ; wait for moves to finish
    M300 P200                   ; two short beeps to indicate load complete
    G4 P100
    M300 P200

    # Set the extruder to the pre-heat temperature now that we've finished loading
    # So it doesn't just sit there and cover itself in goop
    M104 S{preheat_temp}

    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT
    M117 Load Complete!
    LED_READY


#####################################################################
#   Print Macros
#####################################################################

; Available parameters:
;   BED: the temperature to set the bed to (REQUIRED)
;   EXTRUDER: the temperature to set the extruder to (REQUIRED)
;   PREHEAT: the pre-heat temperature to set the nozzle to (defaults to 170)
;   BED_WAIT: the amount of time (in secs) to wait for the bed temp to stabilize (defaults to 0)
;   WAIT_X: the X coordinate to hold the extruder at while waiting (defaults to 1)
;   WAIT_Y: the Y coordinate to hold the extruder at while waiting (defaults to 1)
;   X_CLEAN: the X coordinate to clean the nozzle at (defaults to max X + 1)
;   Y_CLEAN: the Y coordinate to clean the nozzle at (defaults to max Y - 1)
;   ADAPTIVE_ MARGIN: passed to BED_MESH_CALIBRATE (defaults to 0)
; 
; This is based off the example Ella posted.
[gcode_macro PRINT_START]
gcode:
    {% set target_bed = params.BED|int %}
    {% set target_extruder = params.EXTRUDER|int %}
    {% set preheat_temp = params.PREHEAT|default(170)|int %}
    {% set bed_wait = params.BED_WAIT|default(300)|int * 1000 %}
    {% set idle_temp = params.IDLE|default(130)|int %}
    {% set x_wait = params.WAIT_Y|default(1.0)|float %}
    {% set y_wait = params.WAIT_X|default(1.0)|float %}
    {% set clean_x = params.CLEAN_X|default(printer.toolhead.axis_minimum.x|float + 1.0)|float %}
    {% set clean_y = params.CLEAN_Y|default(printer.toolhead.axis_maximum.y|float - 1.0)|float %}
    {% set adaptive_margin = params.ADAPTIVE_MARGIN|default(0)|float %}
    {% set skew_profile = params.SKEW_PROFILE|default(None) %}

    {% set temp_at_start = printer[printer.toolhead.extruder].temperature %}
    {% set preheat_temp_start_delta = preheat_temp|float - temp_at_start %}

    CLEAR_PAUSE
    M107 # Make sure the fan is shut off

    # We don't need any Z offsets where we're going!
    SET_GCODE_OFFSET Z=0.0
    SET_Z_THERMAL_ADJUST COMPONENT="nozzle" enable=0
    G90

    LED_PENDING

    # Note: We set the extruder temp and bed temp sequentially to avoid
    # a funny bug where turning both the extruder and bed pwm to 100% at the same time
    # can cause the positron to shut down.
    M104 S{preheat_temp} # Set pre-heat temp
    SET_DISPLAY_TEXT MSG="Pre-heating nozzle…"
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={preheat_temp} # Wait for extruder to finish heating
    M140 S{target_bed} # Start heating the bed since the nozzle's heated

    SET_DISPLAY_TEXT MSG="Homing…"
    G28 # Force full home (XYZ)
    SET_DISPLAY_TEXT

    G1 Z15 F3000                                          # Move the nozzle away from the bed
    M400                                                  # Wait for the buffer to clear

    BED_MESH_CLEAR                                       # Clear old saved bed mesh (if any)

    G1 X{x_wait} Y{y_wait} F9000                        # Go to the nozzle parking position

    # TODO: someday if someone wants to prepare for adding FLEX support,
    # the retraction distance here and on the de-retract will need to be changed starting here
    COLD_EXTRUDE HEATER=extruder ENABLE=1 # Make sure we can cold extrude for this next step
    G1 E-2 F2400 # Retraction before nozzle clean
    M400 # Finish all pending moves
    COLD_EXTRUDE HEATER=extruder ENABLE=0

    SET_DISPLAY_TEXT MSG="Cleaning nozzle…"
    G1 X{clean_x} Y{clean_y} F7200                        # Go to the nozzle scrub area
    NOZZLE_CLEANUP                                        # Clean that nozzle!
    G1 Z15 F3000

    SET_DISPLAY_TEXT MSG="Waiting for bed to heat…"
    M104 S{idle_temp} # Cool the nozzle back to the idle temp
    M190 S{target_bed}                                  # Wait for the bed to finish heating

    {% if bed_wait > 0 %}
        SET_DISPLAY_TEXT MSG="Waiting for bed temp to stablize…"
        G4 P{bed_wait}
    {% endif %}

    SET_DISPLAY_TEXT MSG="Pre-heating nozzle…"
    M109 S{preheat_temp} # Heat the nozzle for probing

    {% if skew_profile != None %}
        SKEW_PROFILE LOAD={skew_profile}
    {% endif %}
    
    SET_DISPLAY_TEXT MSG="Generating bed mesh…"
    # Enable thermal compensation for the nozzle
    SET_Z_THERMAL_ADJUST COMPONENT="nozzle" enable=1 REF_TEMP={preheat_temp}
    BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={adaptive_margin}

    SET_DISPLAY_TEXT MSG="Heating extruder…"
    M104 S{target_extruder} # Set the final extruder temperature
    G1 X{x_wait} Y{y_wait} Z15 F4800 # Go to the nozzle parking position
    M109 S{target_extruder} # Wait for nozzle to finish heating

    # Extrude purge line
    G92 E0                                                # Reset extruder position
    M83                                                   # Set extruder to relative mode
    G1 E2 F2400 # De-retraction after initial one before nozzle clean

    # Schenanigans if so
    #   {% if filament_type == "FLEX" %}
    #     G1 E4 F2400                                         # Deretraction after the initial one before nozzle cleaning
    #   {% else %}
    #     G1 E2 F2400                                         # Deretraction after the initial one before nozzle cleaning
    #   {% endif %}

    SET_DISPLAY_TEXT MSG="Purging extruder…"
    G0 E7 X{x_wait + 15} Z0.2 F500 ; purge
    G0 X{x_wait + 25} E4 F500 ; purge
    G0 X{x_wait + 35} E4 F650 ; purge
    G0 X{x_wait + 45} E4 F800 ; purge
    G0 X{x_wait + 48} Z0.05 F8000 ; wipe, move close to the bed
    G0 X{x_wait + 51} Z0.2 F8000 ; wipe, move quickly away from the bed

    G92 E0
    M221 S100 ; set flow to 100%

    G1 Z0.3 ; Raise and begin printing.
    SET_DISPLAY_TEXT

# [gcode_macro PRINT_START]
# description: print startup sequence
# gcode:
#     {% set BED_TEMP = params.BED|default(65)|float %}
#     {% set PREHEAT_TEMP = params.PREHEAT|default(160)|float %}
#     {% set EXTRUDER_TEMP = params.EXTRUDER|default(190)|float %}
#     {% set ADAPTIVE_MARGIN = params.ADAPTIVE_MARGIN|default(0)|float %}
#     {% set CLEAN_X = params.CLEAN_X|default(5)|float %}
#     {% set CLEAN_Y = params.CLEAN_Y|default(180)|float %}

#     #SAVE_GCODE_STATE NAME=STATE_PRINT_START

#     ; Clear any Z offset; we're a loadcell now
#     #SET_GCODE_OFFSET Z=0.0

#     LED_PENDING
#     ;PCF_CHECK                          ; test part cooling fan, disable for fans without tachometer
#     M107                                ; turn off part fan
#     M140 S{BED_TEMP}                    ; set bed temperature
#     M109 S{PREHEAT_TEMP}                ; wait for pre-heat temperature for nozzle
#     G28                                 ; home all
#     #PROBE HOME=Z                        ; ...home Z better?
#     G1 Z5 F7200                         ; don't keep the nozzle on the bed

#     G1 X{CLEAN_X} Y{CLEAN_Y} F7200      ; go to the front of the build area
#     NOZZLE_CLEANUP                      ; clean that nozzle!

#     NOZZLE_DOCK                         ; hide in the back while we wait for the bed to heat
#     M190 S{BED_TEMP}                    ; wait for bed temperature
#     NOZZLE_UNDOCK                       ; undock the nozzle
#     BED_MESH_CALIBRATE ADAPTIVE=1 ADAPTIVE_MARGIN={ADAPTIVE_MARGIN} ; do bed mesh leveling

#     NOZZLE_DOCK                         ; re-dock the nozzle
#     M109 S{EXTRUDER_TEMP}               ; set and wait for hot end temperature

#     G90                                 ; use absolute coordinates
#     #RESTORE_GCODE_STATE NAME=STATE_PRINT_START
#     LED_WORKING
#     NOZZLE_PURGE


[gcode_macro PCF_CHECK]
description: Use before print startup, checks the part fan for failures
gcode:
    M106 S128       ; turn on the part fan
    G4 P2000        ; wait for the fan to spin up
    M400            ; wait for wait to finish
    _PCF_CHECKER    ; check part fan speed & respond
    M106 S0         ; turn off the part fan


[gcode_macro _PCF_CHECKER]
description: Helper macro for PCF_CHECK
gcode:
    {% if printer.fan.rpm is not none %}
        {% if printer.fan.rpm > 500 %}
            {action_respond_info("Part cooling fan self-test: PASS")}
        {% else %}
            CANCEL_PRINT
            {action_respond_info("Part cooling fan self-test: FAIL!")}
        {% endif %}
    {% endif %}


[gcode_macro NOZZLE_DOCK]
description: Docks the nozzle at the corner of the bed to prevent ooze
variable_dock_y: 1.0
variable_dock_z: 0.0
gcode:
    _HOME_MAYBE
    SAVE_GCODE_STATE NAME=NOZZLE_DOCK
    G91                           ; relative positioning
    G1 Z5                         ; move nozzle upwards slightly
    G90                           ; absolute positioning
    G0 X{dock_x} Y{dock_y} F7200  ; Go dock position
    G0 Z{dock_z}
    RESTORE_GCODE_STATE NAME=NOZZLE_DOCK


[gcode_macro NOZZLE_UNDOCK]
description: Safely moves the nozzle out of its docking position
gcode:
    _HOME_MAYBE
    SAVE_GCODE_STATE NAME=NOZZLE_UNDOCK
    G91                            ; relative positioning
    G1 Z10                         ; move nozzle upwards slightly
    G90                           ; relative positioning
    RESTORE_GCODE_STATE NAME=NOZZLE_UNDOCK


[gcode_macro PRINT_END]
description: print finish sequence
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    {% set y_final = th.axis_maximum.y - 1 %}
    {% set z_final = [th.position.z + 50, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END
    M400                                     ; wait for buffer to clear
    G92 E0                                   ; zero the extruder
    G1 E-5.0 F3600                           ; retract filament
    TURN_OFF_HEATERS

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X5 Y{y_final} F3600                   ; park the toolhead to the front corner
    RAISE_BED

    M107                                     ; turn off part fan
    SET_Z_THERMAL_ADJUST COMPONENT="nozzle" enable=0
    BED_MESH_CLEAR
    SET_SKEW CLEAR=1

    LED_COMPLETE
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END


#####################################################################
#   LED Macros
#####################################################################

[gcode_macro LED_PENDING]
description: sets the _indicators to teal
gcode:
    SET_LED LED=_indicator RED=0 GREEN=0.4 BLUE=0.2 INDEX=1 TRANSMIT=0
    SET_LED LED=_indicator RED=0 GREEN=0.4 BLUE=0.2 INDEX=3


[gcode_macro LED_WORKING]
description: sets the _indicators to purple
gcode:
    SET_LED LED=_indicator RED=0.5 GREEN=0.1 BLUE=0.6 INDEX=1 TRANSMIT=0
    SET_LED LED=_indicator RED=0.5 GREEN=0.1 BLUE=0.6 INDEX=3


[gcode_macro LED_COMPLETE]
description: sets the _indicators to green
gcode:
    SET_LED LED=_indicator RED=0 GREEN=0.8 BLUE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=_indicator RED=0 GREEN=0.8 BLUE=0 INDEX=3


[gcode_macro LED_ERROR]
description: sets the _indicators to red
gcode:
    SET_LED LED=_indicator RED=0.6 GREEN=0 BLUE=0 INDEX=1 TRANSMIT=0
    SET_LED LED=_indicator RED=0.6 GREEN=0 BLUE=0 INDEX=3


[gcode_macro LED_READY]
description: sets the _indicators and light strips to white
gcode:
    SET_LED LED=_indicator RED=0.5 GREEN=0.5 BLUE=0.5 INDEX=1 TRANSMIT=0
    SET_LED LED=_indicator RED=0.05 GREEN=0.08 BLUE=0.1 INDEX=2 TRANSMIT=0
    SET_LED LED=_indicator RED=0.5 GREEN=0.5 BLUE=0.5 INDEX=3 TRANSMIT=0
    SET_LED LED=_indicator RED=1.0 GREEN=1.0 BLUE=1.0 INDEX=4 TRANSMIT=0
    SET_LED LED=_indicator RED=1.0 GREEN=1.0 BLUE=1.0 INDEX=5


[gcode_macro LED_OFF]
gcode:
    SET_LED LED=_indicator RED=0 GREEN=0 BLUE=0


[delayed_gcode STARTUP_CODE]
initial_duration: 0.5
gcode:
    LED_READY

# vim: ts=4 sts=4 sw=4 expandtab tw=100
